<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the game draw under the notch; safe areas are handled by the app -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d98b0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Archipel" />
    <meta name="description" content="Achetez des îlots imaginaires, gagnez des doublons même application fermée." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Archipel des Perles</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      /* a game screen: no page scroll, no pull-to-refresh, no double-tap zoom, no grey tap flash */
      body { overflow: hidden; overscroll-behavior: none; background: #3d98b0; margin: 0;
        -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      #root { display: flex; height: 100%; flex: 1; }
      @media (prefers-color-scheme: dark) { body { background: #071d27; } }
    </style>
  </head>
  <body>
    <noscript>Activez JavaScript pour jouer.</noscript>
    <div id="root"></div>
  </body>
</html>
